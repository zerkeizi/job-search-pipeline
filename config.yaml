preferences:
  target_titles: ["full stack", "fullstack", "back-end", "node", "react"]
  seniority: ["pleno", "senior", "mid"]
  remote_only: false
  city: "Porto Alegre"
  city_aliases: ["POA", "Porto Alegre, RS", "Porto Alegre - RS"]
  max_office_days_per_week: 3
  languages: ["en", "pt", "es"]
filters:
  exclude_title_words: ["estágio", "intern", "junior", "lead", "manager"]
  max_age_days: 21
  blocked_companies: []
dedupe:
  window_days: 60
  same_threshold: 0.8
  similar_threshold: 0.5
sources:
  jobspy:
    enabled: true
    sites: ["linkedin", "indeed", "glassdoor", "google"]
    searches:
      - { term: "full stack developer", location: "Brazil", country_indeed: "Brazil" }
      - { term: "node.js developer", location: "Brazil", country_indeed: "Brazil", is_remote: true }
    window_margin_hours: 12
    max_hours_old: 168
    results_wanted: 30
    fetch_description: true   # one extra request per job on boards whose search results lack descriptions
  gupy: { enabled: true, queries: ["full stack", "node", "react"] }
  # Board tokens, e.g. boards.greenhouse.io/<token>, jobs.lever.co/<company>, jobs.ashbyhq.com/<board>.
  greenhouse: { enabled: true, companies: [] }
  lever: { enabled: true, companies: [] }
  ashby: { enabled: true, companies: [] }
  # Remotive asks for at most ~4 requests a day and a link back to their job URL.
  remotive: { enabled: true, category: software-development, min_interval_hours: 6 }
models:
  tailoring: sonnet   # alias accepted by `claude --model`; calls go through the Claude Code subscription
render:
  # Times New Roman, as in cv/original.pdf. Read from the Windows install; never copied into the repo.
  font_dir: /mnt/c/Windows/Fonts
  fonts: { regular: times.ttf, bold: timesbd.ttf }
  # The final CV is 1 page. If the tailored content still overflows, everything (fonts, spacing,
  # margins) is scaled down proportionally in scale_step steps, never below min_scale.
  min_scale: 0.9
  scale_step: 0.02
thresholds:
  generate: 70
limits:
  generate_per_run: 10
  request_delay_seconds: 1.5
  sidecar_delay_seconds: 20
  sidecar_timeout_seconds: 300
  llm_timeout_seconds: 300
