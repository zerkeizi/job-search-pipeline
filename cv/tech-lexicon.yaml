# Tech Lexicon (see GLOSSARY.md): technologies that exist in the market, whether or not I know them.
# The guard blocks any of these in generated text unless the Base CV supports it; scoring uses it
# to find what a Job asks for. Add a term whenever one slips through review.
# Entries are matched case-insensitively on word boundaries, except those listed under `case_sensitive`
# (terms that are also ordinary English words or names); a term listed there is matched case-sensitively
# wherever else it appears.

# Categories `languages`, `frontend` and `backend` are the core stack: they weigh more in the score.
